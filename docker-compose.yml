version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: diplomaconnect_db
    restart: always
    environment:
      POSTGRES_DB: diplomaconnect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: diplomaconnect_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata:
